[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "backaction-support-modules"
version = "0.1.0"
description = "Support modules for back-action QFI notebook studies, on top of the group's quantum_sensing package"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "qutip>=5.0,<6",
    "pandas>=2.0",
    "h5py",
]

[tool.setuptools.packages.find]
include = ["backaction_qfi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
